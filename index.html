<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI DSLR Photo Enhancer</title>

  <!-- TensorFlow & Upscaler AI engine (Local Browser) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@upscalerjs/default-model@latest/dist/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/upscaler@latest/dist/browser/umd/upscaler.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0f19;
      color: #f1f5f9;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      max-width: 520px;
      margin: 10px auto;
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    h2 { color: #38bdf8; margin-top: 0; }
    p { color: #94a3b8; font-size: 14px; }
    .upload-zone {
      border: 2px dashed #475569;
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
    }
    input[type="file"] { width: 100%; color: #cbd5e1; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #38bdf8;
      font-weight: 600;
    }
    .result-container {
      margin-top: 25px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .download-btn {
      display: block;
      text-decoration: none;
      background: #10b981;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: bold;
      width: 80%;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>✨ DSLR AI Photo Enhancer</h2>
    <p>Photo upload karein aur browser me bina kisi error ke sharp HD banayein</p>

    <div class="upload-zone">
      <input type="file" id="imageInput" accept="image/*" />
    </div>

    <!-- Hidden source img for processing -->
    <img id="sourceImg" style="display:none;" />

    <button id="processBtn" disabled>Enhance & Sharp Photo</button>

    <div id="status"></div>

    <div class="result-container" id="resultArea">
      <h3>Enhanced Result</h3>
      <img id="enhancedImage" alt="Enhanced Output" />
      <a id="downloadLink" class="download-btn" download="sharp_photo.png">Download HD Photo</a>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const sourceImg = document.getElementById('sourceImg');
    const processBtn = document.getElementById('processBtn');
    const status = document.getElementById('status');
    const resultArea = document.getElementById('resultArea');
    const enhancedImage = document.getElementById('enhancedImage');
    const downloadLink = document.getElementById('downloadLink');

    let upscalerInstance = null;

    // AI Engine initialize
    try {
      upscalerInstance = new Upscaler();
    } catch (e) {
      console.error(e);
    }

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        sourceImg.src = URL.createObjectURL(file);
        sourceImg.onload = () => {
          processBtn.disabled = false;
          status.innerText = "Photo select ho gayi! Ab 'Enhance & Sharp Photo' par click karein.";
        };
      }
    });

    processBtn.addEventListener('click', async () => {
      processBtn.disabled = true;
      resultArea.style.display = 'none';
      status.innerText = "Enhancing photo... Pixel details reconstruct ho rahi hain (Device GPU use ho raha hai)...";

      try {
        if (!upscalerInstance) {
          upscalerInstance = new Upscaler();
        }

        // Direct Browser Upscaling (No external server fail)
        const enhancedDataUrl = await upscalerInstance.upscale(sourceImg);

        enhancedImage.src = enhancedDataUrl;
        downloadLink.href = enhancedDataUrl;
        resultArea.style.display = 'flex';
        status.innerText = "Success! Photo enhance ho gayi.";
      } catch (err) {
        console.error(err);
        status.innerText = "Error: Processing fail hui: " + err.message;
      } finally {
        processBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
