<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI DSLR Photo Enhancer</title>
  <!-- Gradio Client library -->
  <script type="module">
    import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
    window.GradioClient = Client;
  </script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 30px 15px;
      margin: 0;
    }
    .card {
      max-width: 650px;
      margin: 0 auto;
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 { margin-bottom: 8px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; }
    .upload-box {
      border: 2px dashed #475569;
      border-radius: 10px;
      padding: 25px;
      margin: 20px 0;
      cursor: pointer;
    }
    button {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
    #status { margin-top: 15px; font-weight: bold; color: #38bdf8; }
    .result-container {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .download-btn {
      display: inline-block;
      text-decoration: none;
      background: #10b981;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>✨ DSLR AI Photo Enhancer</h1>
    <p>Low-quality ya blurry photo upload karein aur crisp sharp HD me convert karein</p>

    <div class="upload-box">
      <input type="file" id="imageInput" accept="image/*" />
    </div>

    <button id="processBtn" disabled>Enhance to DSLR Sharpness</button>

    <div id="status"></div>

    <div class="result-container" id="resultArea" style="display: none;">
      <h3>Enhanced Result (Clear & Sharp)</h3>
      <img id="enhancedImage" alt="Enhanced Photo" />
      <a id="downloadLink" class="download-btn" download="sharp_image.png">Download HD Photo</a>
    </div>
  </div>

  <script type="module">
    const imageInput = document.getElementById('imageInput');
    const processBtn = document.getElementById('processBtn');
    const status = document.getElementById('status');
    const resultArea = document.getElementById('resultArea');
    const enhancedImage = document.getElementById('enhancedImage');
    const downloadLink = document.getElementById('downloadLink');

    let selectedFile = null;

    imageInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        selectedFile = e.target.files[0];
        processBtn.disabled = false;
        status.innerText = "Photo select ho gayi! Ab 'Enhance' par click karein.";
      }
    });

    processBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      processBtn.disabled = true;
      status.innerText = "AI processing start ho rahi hai... High-resolution details add ki ja rahi hain (kripya thoda wait karein)...";

      try {
        // Free Real-ESRGAN Gradio client connection
        const app = await window.GradioClient.connect("akhaliq/Real-ESRGAN");

        // Model run karna (File upload karke 4x sharp karna)
        const result = await app.predict("/predict", [
          selectedFile, // User ki photo
          "R-ESRGAN 4x+", // Sabse sharp model option
          0.5 // Denoise strength
        ]);

        if (result && result.data && result.data[0]) {
          const finalUrl = result.data[0].url || result.data[0];
          enhancedImage.src = finalUrl;
          downloadLink.href = finalUrl;
          resultArea.style.display = "flex";
          status.innerText = "Success! Photo DSLR jaisi sharp ho chuki hai.";
        } else {
          status.innerText = "Processing poori hui lekin result nahi mila.";
        }
      } catch (error) {
        console.error(error);
        status.innerText = "Error: Processing me problem aayi. Kripya dobara try karein.";
      } finally {
        processBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
