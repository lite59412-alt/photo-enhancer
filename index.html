<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI DSLR Photo Enhancer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0f19;
      color: #f1f5f9;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      max-width: 520px;
      margin: 20px auto;
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    h2 { color: #38bdf8; margin-top: 0; }
    p { color: #94a3b8; font-size: 14px; }
    .upload-zone {
      border: 2px dashed #475569;
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
    }
    input[type="file"] { width: 100%; color: #cbd5e1; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #38bdf8;
      line-height: 1.4;
      word-break: break-word;
    }
    .result-container {
      margin-top: 25px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .download-btn {
      display: block;
      text-decoration: none;
      background: #10b981;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: bold;
      width: 80%;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>✨ DSLR AI Photo Enhancer</h2>
    <p>Low-quality photo upload karein aur sharp HD me convert karein</p>

    <div class="upload-zone">
      <input type="file" id="imageInput" accept="image/*" />
    </div>

    <button id="processBtn" disabled>Enhance to DSLR Sharpness</button>

    <div id="status"></div>

    <div class="result-container" id="resultArea">
      <h3>Enhanced Result</h3>
      <img id="enhancedImage" alt="Enhanced Photo" />
      <a id="downloadLink" class="download-btn" download="sharp_image.png">Download HD Photo</a>
    </div>
  </div>

  <script type="module">
    import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

    const imageInput = document.getElementById('imageInput');
    const processBtn = document.getElementById('processBtn');
    const status = document.getElementById('status');
    const resultArea = document.getElementById('resultArea');
    const enhancedImage = document.getElementById('enhancedImage');
    const downloadLink = document.getElementById('downloadLink');

    let rawFile = null;

    imageInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        rawFile = e.target.files[0];
        processBtn.disabled = false;
        status.innerText = "Photo select ho gayi! Ab 'Enhance' par click karein.";
      }
    });

    processBtn.addEventListener('click', async () => {
      if (!rawFile) return;

      processBtn.disabled = true;
      resultArea.style.display = "none";
      status.innerText = "AI Space connect ho raha hai... (Space wake-up me 10-20 sec lag sakte hain)";

      try {
        // High stability Real-ESRGAN instance connect
        const app = await Client.connect("doevent/Face-Real-ESRGAN");

        status.innerText = "Processing image... Pixels reconstruct ho rahe hain...";

        const result = await app.predict(0, [
          rawFile,     // Uploaded image file
          "Base",      // Mode
          2,           // Denoise
          4            // 4x Scale
        ]);

        if (result && result.data) {
          let outputUrl = "";
          if (Array.isArray(result.data)) {
            outputUrl = result.data[0]?.url || result.data[0];
          } else {
            outputUrl = result.data?.url || result.data;
          }

          enhancedImage.src = outputUrl;
          downloadLink.href = outputUrl;
          resultArea.style.display = "flex";
          status.innerText = "Done! Image clear ho chuki hai.";
        } else {
          status.innerText = "Model ne response diya par image nahi mili.";
        }
      } catch (err) {
        console.error(err);
        status.innerText = "Error: " + (err.message || "Connection timeout. Dobara click karein.");
      } finally {
        processBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
